<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jingle's Christmas Photo Hunt</title>
<style>
:root{
  --green:#0f4d34; --green-d:#08301f; --green-l:#e3f3ea;
  --red:#c8102e; --red-d:#8f0b20; --red-l:#fde6ea;
  --gold:#f5a20f; --gold-l:#fff1d1;
  --blue:#1d5fa8; --blue-l:#e2edf9;
  --purple:#6b3fa0; --purple-l:#efe6fa;
  --ink:#17201c; --grey:#5b6660; --line:#d6ddd9; --snow:#fbfaf6;
  --fs:28px;
}
*{box-sizing:border-box;touch-action:manipulation}
html{font-size:var(--fs);overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--green-d);color:var(--ink);
  font-family:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  line-height:1.35;overflow-x:hidden}
.disp{font-family:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;font-weight:900}
button{font:inherit;font-size:1rem;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3{margin:0;overflow-wrap:break-word;hyphens:none}

/* snow */
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flake{position:absolute;top:-2rem;color:#fff;opacity:.75;animation:fall linear infinite;font-size:.8rem}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#111;color:#fff;display:flex;align-items:center;gap:.3rem;padding:.3rem .4rem;flex-wrap:wrap}
.dots{display:flex;gap:.18rem;flex:none}
.dots i{width:.42rem;height:.42rem;border-radius:50%;display:block}
.addr{flex:1 1 6rem;min-width:0;background:#2a2a2a;border-radius:2rem;padding:.2rem .6rem;font-size:.72rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd}
.addr b{color:var(--gold)}
.tbtn{background:#2f2f2f;border:2px solid #444;color:#fff;border-radius:.5rem;min-width:2.2rem;min-height:2.2rem;padding:0 .4rem;font-weight:700}
.tbtn[hidden]{display:none}
.saved{position:absolute;top:calc(100% + .3rem);right:.5rem;z-index:30;background:var(--green);color:#fff;border-radius:2rem;padding:.15rem .6rem;
  font-size:.75rem;opacity:0;transition:opacity .3s;pointer-events:none}
.saved.on{opacity:1}

/* lights progress */
.lights{position:relative;z-index:1;display:flex;justify-content:center;gap:.15rem;padding:.35rem .3rem .2rem;flex-wrap:wrap;background:var(--green-d)}
.bulb{width:.7rem;height:.95rem;border-radius:50% 50% 45% 45%;background:#33463d;border-top:.18rem solid #777;transition:.4s}
.bulb.on{box-shadow:0 0 .5rem currentColor}

main{position:relative;z-index:1;max-width:46rem;margin:0 auto;padding:.6rem .55rem 6rem}
.card{background:var(--snow);border-radius:1rem;padding:min(.9rem,4vw);margin:.7rem 0;box-shadow:0 .3rem 0 rgba(0,0,0,.25)}

/* hero */
.pill{display:inline-block;background:var(--red);color:#fff;border-radius:2rem;padding:.15rem .75rem;font-size:.8rem;font-weight:700;letter-spacing:.02em}
.hero{background:linear-gradient(135deg,var(--red) 0%,var(--red-d) 100%);color:#fff;border-radius:1rem;padding:1rem;margin-top:.6rem;position:relative;overflow:hidden}
.hero h1{font-size:min(1.7rem,10vw);line-height:1.1;margin:.4rem 0}
.hero p{margin:.35rem 0}
.hero .big{font-size:2.6rem;position:absolute;right:.6rem;top:.4rem;opacity:.9}
.hero .pill{background:var(--gold);color:#111}

.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(7rem,100%),1fr));gap:.5rem;margin:.6rem 0}
.st{border-radius:.8rem;padding:.6rem;text-align:center;font-weight:700}
.st span{display:block;font-size:1.8rem}
.rules{margin:.3rem 0 0;padding-left:1.1rem}
.rules li{margin:.25rem 0}

label.lab{display:block;font-weight:700;margin:.4rem 0 .3rem}
input.team{width:100%;font:inherit;font-size:1rem;padding:.45rem .6rem;border:3px solid var(--green);border-radius:.6rem;min-height:2.4rem}

.big-btn{display:block;width:100%;border:0;border-radius:.8rem;padding:.55rem .8rem;min-height:2.5rem;font-weight:700;margin:.5rem 0;
  box-shadow:0 .2rem 0 rgba(0,0,0,.3)}
.b-red{background:var(--red);color:#fff}
.b-green{background:var(--green);color:#fff}
.b-gold{background:var(--gold);color:#111}
.b-white{background:#fff;color:var(--ink);border:3px solid var(--line)}
.big-btn:active{transform:translateY(.1rem);box-shadow:none}
.big-btn[disabled]{opacity:.45;cursor:not-allowed}

/* tree */
.treebox{background:radial-gradient(circle at 50% 40%,#16603f,#08301f 75%);border-radius:1rem;padding:.6rem;text-align:center;color:#fff}
.treebox svg{width:100%;max-width:17rem;height:auto;display:block;margin:0 auto}
.count{font-size:1.1rem;margin:.2rem 0}
.welcome{background:var(--gold);color:#111;border-radius:.8rem;padding:.6rem .8rem;font-weight:700;margin-top:.6rem}

.zone{margin:1rem 0 .2rem;display:flex;align-items:center;gap:.4rem;color:#fff}
.zone .zl{width:1.9rem;height:1.9rem;border-radius:.5rem;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
.zone h2{font-size:min(1.05rem,7vw)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(9rem,100%),1fr));gap:.5rem}
.sc{background:var(--snow);border:0;border-radius:.9rem;padding:.6rem;text-align:left;min-height:4.5rem;position:relative;border-bottom:.35rem solid var(--line);display:flex;flex-direction:column;gap:.15rem}
.sc .em{font-size:1.6rem;line-height:1}
.sc .t{font-weight:700;line-height:1.15}
.sc .s{font-size:.75rem;color:var(--grey)}
.sc.done{background:#1a8a4a;color:#fff;border-bottom-color:#0b4d27!important;box-shadow:0 0 0 .2rem #7ee0a4 inset}
.sc.done .t{color:#fff}
.sc.done .s{color:#fff;font-weight:900;font-size:.95rem}
.sc.done .tag{background:rgba(255,255,255,.22)!important;color:#fff!important}
.sc.done::after{content:"✓";position:absolute;right:.45rem;top:.45rem;width:1.9rem;height:1.9rem;border-radius:50%;
  background:#fff;color:#1a8a4a;display:grid;place-items:center;font-weight:900;font-size:1.25rem;line-height:1;box-shadow:0 .1rem .3rem rgba(0,0,0,.3)}
.sc.part{background:#fff4dc;box-shadow:0 0 0 .2rem #f5a20f inset}
.sc.part .s{color:#8a5210;font-weight:900}
.sc .tag{align-self:flex-start;font-size:.68rem;border-radius:2rem;padding:.02rem .45rem;font-weight:700;margin-top:.15rem}

/* station */
.shead{flex-wrap:wrap;border-radius:1rem;padding:min(.8rem,4vw);color:#fff;display:flex;gap:.6rem;align-items:center}
.shead .em{font-size:2.4rem;flex:none}
.shead>div{min-width:0}
@media (max-width:420px){.shead .em{font-size:1.6rem}}
.shead h1{font-size:min(1.3rem,8.5vw);line-height:1.15}
.shead .k{font-size:.75rem;opacity:.9;font-weight:700}
.step{display:flex;gap:.5rem;align-items:flex-start}
.step .n{flex:none;width:1.8rem;height:1.8rem;border-radius:.45rem;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}
.step>div{flex:1;min-width:0}
main p,main li,main .ph,main .q{overflow-wrap:break-word}
.step h2{font-size:min(1.05rem,7vw);margin-bottom:.2rem}
.step p{margin:.15rem 0}
.locked{opacity:.5}
.photo{width:100%;border-radius:.8rem;display:block;margin:.5rem 0;border:4px solid #fff;box-shadow:0 0 0 3px var(--green)}
.camwrap{position:relative}
.camwrap input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.note{background:var(--gold-l);border-left:.4rem solid var(--gold);border-radius:.5rem;padding:.4rem .6rem;margin:.5rem 0;font-size:.9rem}
.note.warn{background:var(--red-l);border-color:var(--red)}
.tagline{display:inline-block;font-size:.72rem;font-weight:700;border-radius:2rem;padding:.05rem .5rem;margin-bottom:.3rem}
.q{font-weight:700;font-size:1.05rem;margin:.3rem 0 .5rem;white-space:pre-line}
.opt{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;background:#fff;border:3px solid var(--blue);border-radius:.8rem;
  padding:.45rem .6rem;min-height:2.3rem;margin:.4rem 0;white-space:pre-line}
.opt .L{flex:none;width:1.6rem;height:1.6rem;border-radius:.4rem;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.85rem}
.opt>span:last-child{min-width:0;overflow-wrap:break-word}
.opt.no{border-color:#bbb;background:#f1f1f1;color:#888;text-decoration:line-through}
.opt.no .L{background:#bbb}
.opt.yes{border-color:var(--green);background:var(--green-l)}
.opt.yes .L{background:var(--green)}
.fb{border-radius:.6rem;padding:.45rem .6rem;margin:.4rem 0;font-weight:700}
.fb.ok{background:var(--green-l);color:var(--green-d)}
.fb.bad{background:var(--red-l);color:var(--red-d)}
.why{font-weight:400;display:block;margin-top:.2rem}
.seq{min-height:2.3rem;border:3px dashed var(--line);border-radius:.8rem;padding:.3rem;margin:.4rem 0}
.seq .it{display:flex;gap:.4rem;align-items:center;background:var(--green-l);border-radius:.5rem;padding:.25rem .45rem;margin:.2rem 0}
.seq .it b{flex:none;background:var(--green);color:#fff;border-radius:.35rem;width:1.5rem;height:1.5rem;display:grid;place-items:center;font-size:.8rem}
.say{background:var(--purple-l);border:3px solid var(--purple);border-radius:.8rem;padding:.6rem;margin:.4rem 0}
.say .ph{font-weight:700;font-size:1.15rem}
.say ul{margin:.3rem 0;padding-left:1.1rem}
.stress{color:var(--red);text-decoration:underline;text-decoration-thickness:.12rem}
.row{display:flex;gap:.4rem;flex-wrap:wrap}
.row .big-btn{flex:1 1 min(8rem,100%);width:auto}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#111;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom));display:flex;gap:.4rem}
.bar .big-btn{margin:0;flex:1}

/* finish */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(5.5rem,100%),1fr));gap:.35rem;margin:.5rem 0}
.gallery figure{margin:0;background:#fff;border-radius:.5rem;overflow:hidden;border:2px solid var(--line)}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gallery figcaption{font-size:.7rem;padding:.1rem .25rem;text-align:center;line-height:1.1}
.stars{font-size:1.8rem;letter-spacing:.1rem}
.treewrap{position:relative;max-width:17rem;margin:0 auto}
.starbtn{position:absolute;left:36%;top:0;width:28%;height:26%;background:transparent;border:0;border-radius:50%;padding:0;margin:0;min-height:0}
.starline{display:inline-block;font-weight:700;color:#ffe48a;margin:.3rem 0;background:rgba(255,255,255,.1);border:2px solid #ffe48a;border-radius:2rem;padding:.25rem .8rem;min-height:2.2rem}
.starline.on{color:#ffd23f;font-size:1.05rem}
.songs{margin:.3rem 0;padding-left:1.1rem}
.songs li{margin:.25rem 0;font-weight:700}
.recbtn{background:var(--red);color:#fff}
.recbtn.on{background:#111;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .4rem rgba(200,16,46,.35)}}
.timer{font-family:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;font-size:1.6rem;font-weight:700;text-align:center;margin:.3rem 0}
.media{width:100%;margin:.4rem 0;border-radius:.6rem}
.cardimg{width:100%;border-radius:.8rem;margin:.5rem 0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.flake{display:none}.pop{animation:none}*{transition:none!important}}
@media (max-width:420px){.hero .big{display:none}.row{flex-direction:column;gap:0}.row .big-btn{width:100%}}
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>
<header class="top">
  <div class="dots" aria-hidden="true"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="addr" id="addr">jingle.hunt › <b>start</b></div>
  <button class="tbtn" id="aMinus" aria-label="Smaller text">A−</button>
  <button class="tbtn" id="aPlus" aria-label="Bigger text">A+</button>
  <button class="tbtn" id="fsBtn" aria-label="Full screen" hidden>⛶</button>
  <button class="tbtn" id="homeBtn" aria-label="Go to the tree">🎄</button>
  <div class="saved" id="saved">✓ Saved</div>
</header>
<div class="lights" id="lights" aria-hidden="true"></div>
<main id="main"></main>
<nav class="bar" id="bar"></nav>
<canvas id="fx"></canvas>

 {id:"library",pos:0,z:1,em:"📚",title:"The library",tag:"VU23560: search",

 {id:"tinsel",pos:0,z:3,em:"🎊",title:"Tinsel",tag:"Prepositions",

 {id:"car",pos:2,z:3,em:"🚗",title:"A Christmas car",tag:"Word forms",

 {id:"santa",pos:0,z:3,em:"🎅",title:"Santa",tag:"Christmas words",

/* ---------- shuffle ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function idxs(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
function orderFor(s){
  var x=stOf(s.id);
  if(s.type==="choice"){
    /* fixed order: the right answer sits at s.pos, the others keep their order */
    var rest=[];for(var q=0;q<s.opts.length;q++)if(q!==s.a)rest.push(q);
    rest.splice(s.pos,0,s.a);return rest;
  }
  if(s.type==="order")return s.fixed;
  var n=s.opts.length;
  if(!x.order||x.order.length!==n){
    var o;var tries=0;
    do{o=shuffle(idxs(n));tries++;}while(s.type==="order"&&o.join()===idxs(n).join()&&tries<20);
    x.order=o;
  }
  return x.order;
}

  rows.forEach(function(r){var half=hw(r[0])*0.82-5;for(var i=0;i<r[1];i++){var x=100-half+(2*half)*i/(r[1]-1);o.push([Math.round(x),r[0]+(i%2?2:0)]);}});
  return o;})();

function handlePhoto(s,file){
  var msg=document.getElementById("camMsg");msg.innerHTML='<div class="note">Saving your photo ...</div>';
  var url=URL.createObjectURL(file);var img=new Image();
  img.onload=function(){
    try{
      var max=640,w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(h*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var data=c.toDataURL("image/jpeg",0.62);
      var ok=setPhoto(s.id,data);
      var x=stOf(s.id);var was=isDone(s.id);x.photo=true;save();URL.revokeObjectURL(url);
      renderStation();
      if(!ok&&CAN){document.getElementById("camMsg").innerHTML='<div class="note warn">The phone is full. This photo is here for now only. Do not close the page.</div>';}
      if(!was&&isDone(s.id))celebrate();
    }catch(e){msg.innerHTML='<div class="note warn">Sorry, that photo did not work. Try again.</div>';}
  };
  img.onerror=function(){msg.innerHTML='<div class="note warn">Sorry, that photo did not work. Try again.</div>';};
  img.src=url;
}

    });
    h+='<div id="fb">'+(x.ok?'<div class="fb ok">✓ '+(x.first?'Right first time!':'You got it!')+'<span class="why">'+esc(s.why)+'</span></div>':(x.no.length?'<div class="fb bad">Not yet. Try again.</div>':''))+'</div>';

      h+='<div class="seq" aria-live="polite">'+(x.seq.length?x.seq.map(function(oi,i){return '<div class="it"><b>'+(i+1)+'</b>'+esc(s.items[oi])+'</div>';}).join(""):'<span style="color:var(--grey)">Your steps go here.</span>')+'</div>';
      o2.forEach(function(oi,pos){if(x.seq.indexOf(oi)>-1)return;
        h+='<button class="opt" data-ord="'+oi+'"><span class="L">'+"ABCDE"[pos]+'</span><span>'+esc(s.items[oi])+'</span></button>';});
      if(x.seq.length)h+='<button class="big-btn b-white" id="undoBtn">↩ Start the steps again</button>';
      if(x.no.length&&!x.seq.length)h+='<div class="fb bad">Not quite. Try again. Think: what do you do first?</div>';
    }
  }else if(s.type==="say"){
    h+='<p>'+esc(s.say)+'</p><div class="say"><div class="ph">'+esc(s.phrase)+'</div><p style="margin:.3rem 0 0">For example:</p><ul>'+s.ex.map(function(e){return '<li>'+esc(e)+'</li>';}).join("")+'</ul></div>';
    h+=x.ok?'<div class="fb ok">✓ Well done, team!</div>':'<button class="big-btn b-red" id="sayBtn">'+esc(s.done)+'</button>';
  }else if(s.type==="sayit"){
    h+='<p>'+esc(s.say)+'</p><div class="say"><div class="ph">'+s.stressed+'</div></div>';

    h+=x.ok?'<div class="fb ok">✓ Merry Christmas to you too!</div>':'<button class="big-btn b-red" id="sayBtn">'+esc(s.done)+'</button>';
  }
  return h;
}

function speak(t,rate){

    if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

function finishTask(s,x,first){
  var was=isDone(s.id);x.ok=true;if(x.first===null)x.first=first;save();renderStation();
  if(!was&&isDone(s.id))celebrate();
}
function bindTask(s,x){
  if(s.type==="choice"&&!x.ok){
    var o=orderFor(s);
    M.querySelectorAll("[data-pos]").forEach(function(b){b.onclick=function(){
      var oi=o[+b.getAttribute("data-pos")];
      if(oi===s.a){finishTask(s,x,x.no.length===0);}
      else{if(x.no.indexOf(oi)<0)x.no.push(oi);save();renderStation();}
    };});
  }
  if(s.type==="order"&&!x.ok){
    M.querySelectorAll("[data-ord]").forEach(function(b){b.onclick=function(){
      x.seq.push(+b.getAttribute("data-ord"));
      if(x.seq.length===s.items.length){
        var right=x.seq.every(function(v,i){return v===i;});
        if(right){finishTask(s,x,x.no.length===0);return;}
        x.no.push(1);x.seq=[];
      }
      save();renderStation();
    };});
    var u=document.getElementById("undoBtn");if(u)u.onclick=function(){x.seq=[];save();renderStation();};
  }
  if(s.type==="say"||s.type==="sayit"){
    var sb=document.getElementById("sayBtn");if(sb)sb.onclick=function(){finishTask(s,x,true);};
    var lb=document.getElementById("lisBtn");if(lb)lb.onclick=function(){speak(s.phrase,0.95);};
    var sl=document.getElementById("slowBtn");if(sl)sl.onclick=function(){speak(s.phrase,0.7);};
  }
}

/* ---------- SING: record a Christmas song (lights the star) ---------- */
var IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var IS_WEBKIT=IS_IOS||(/Safari/.test(navigator.userAgent)&&!/Chrome|Chromium|Edg/.test(navigator.userAgent));
var pendingSong=null,songMem=null;
var rec={mr:null,stream:null,chunks:[],t0:0,tick:null,auto:null,stopping:false};
function extFor(t){t=t||"";return /mp4|m4a|aac/.test(t)?"m4a":(/webm/.test(t)?"webm":(/quicktime|mov/.test(t)?"mov":(/wav/.test(t)?"wav":(/ogg/.test(t)?"ogg":"m4a"))));}
function mediaTag(r){var u=URL.createObjectURL(r.blob);
  return r.kind==="video"?'<video class="media" controls playsinline webkit-playsinline src="'+u+'"></video>'
                         :'<audio class="media" controls playsinline webkit-playsinline src="'+u+'"></audio>';}
function idb(cb){
  try{if(!window.indexedDB){cb(null);return;}
    var r=indexedDB.open(KEY+"_media",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("m");};
    r.onsuccess=function(){cb(r.result);};r.onerror=function(){cb(null);};
  }catch(e){cb(null);}
}
function putSong(o,cb){songMem=o;idb(function(db){if(!db){cb(false);return;}
  try{var tx=db.transaction("m","readwrite");tx.objectStore("m").put(o,"song");tx.oncomplete=function(){cb(true);};tx.onerror=tx.onabort=function(){cb(false);};}catch(e){cb(false);}});}
function getSong(cb){if(songMem){cb(songMem);return;}idb(function(db){if(!db){cb(null);return;}
  try{var g=db.transaction("m").objectStore("m").get("song");g.onsuccess=function(){if(g.result)songMem=g.result;cb(g.result||null);};g.onerror=function(){cb(null);};}catch(e){cb(null);}});}
function delSong(){songMem=null;idb(function(db){if(!db)return;try{db.transaction("m","readwrite").objectStore("m").delete("song");}catch(e){}});}
function micAllowedHere(){try{var pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature)return pp.allowsFeature("microphone");}catch(e){}return true;}
var micFailed=false;
function canMic(){return !micFailed&&!!(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)&&micAllowedHere();}
function fmt(sec){sec=Math.floor(sec);return Math.floor(sec/60)+":"+("0"+sec%60).slice(-2);}

function renderSing(s,z,x){
  var h='<div class="shead" style="background:'+z.col+'"><span class="em">'+s.em+'</span><div><div class="k">The Christmas star 🌟</div><h1 class="disp">'+esc(s.title)+'</h1></div></div>';
  h+='<div class="card step"><span class="n">1</span><div><h2 class="disp">Choose a song 🎶</h2><p>Choose one song with your team.</p>';
  h+='<ul class="songs"><li>🔔 Jingle Bells</li><li>🎄 We Wish You a Merry Christmas</li><li>⭐ Silent Night</li><li>🎵 Your own favourite Christmas song</li></ul>';
  h+='<p>Sing together for 20 seconds or more.</p></div></div>';
  h+='<div class="card"><div class="step"><span class="n">2</span><div><h2 class="disp">Record it 🎤</h2>';
  if(canMic()){
    h+='<div class="timer" id="timer">0:00</div>';
    h+='<button class="big-btn recbtn'+(rec.mr?' on':'')+'" id="recBtn">'+(rec.mr?'⏹ Stop':'🔴 Start recording')+'</button>';
    h+='<p style="font-size:.85rem">Turn off silent mode so you can hear it.</p>';
  }else{
    h+='<div class="note">Voice recording does not work on this page. Use the camera to film your song. Point the camera at a decoration, not at people.</div>';
  }
  h+='<div class="camwrap"><input type="file" accept="video/*" capture="environment" id="vid" aria-label="Film your song">';
  h+='<button class="big-btn '+(canMic()?'b-white':'b-green')+'" id="vidBtn" style="'+(canMic()?'font-size:.85rem':'')+'">🎥 '+(canMic()?'Microphone not working? Film it instead':'Film our song')+'</button></div>';
  h+='<div id="recMsg"></div></div></div></div>';
  h+='<div class="card"><div class="step"><span class="n">3</span><div><h2 class="disp">Listen and save 🌟</h2><div id="songOut"><p>Record your song first.</p></div></div></div></div>';
  M.innerHTML=h;
  var nx=nextAfter(s);
  BAR.innerHTML='<button class="big-btn b-white" id="backBtn">🎄 Tree</button>'+(isDone(s.id)&&nx?'<button class="big-btn b-red" id="nextBtn">Next place ›</button>':'');
  document.getElementById("backBtn").onclick=function(){if(rec.mr)stopRec();go("map");};
  if(document.getElementById("nextBtn"))document.getElementById("nextBtn").onclick=function(){go("station",nx.id);};
  var rb=document.getElementById("recBtn");if(rb)rb.onclick=function(){if(rec.mr)stopRec();else startRec();};
  var vid=document.getElementById("vid");
  document.getElementById("vidBtn").onclick=function(){if(rec.mr)stopRec();vid.click();};
  vid.onchange=function(){var f=vid.files&&vid.files[0];if(!f)return;
    if(f.size<256){recMsg("Nothing was recorded. Try again.",true);return;}
    pendingSong={blob:f,type:f.type||"video/quicktime",kind:"video"};showSong(s,x);};
  showSong(s,x);
}
function recMsg(t,bad){var m=document.getElementById("recMsg");if(m)m.innerHTML=t?'<div class="note'+(bad?' warn':'')+'">'+esc(t)+'</div>':'';}
function showSong(s,x){
  var out=document.getElementById("songOut");if(!out)return;
  if(pendingSong){
    out.innerHTML='<p>Listen to your song. Do you like it?</p>'+mediaTag(pendingSong)+
      '<button class="big-btn b-gold" id="saveSong">🌟 Save our song and light the star</button><p style="font-size:.85rem">Not happy? Record it again.</p>';
    document.getElementById("saveSong").onclick=function(){
      var o=pendingSong;var was=isDone(s.id);
      putSong(o,function(ok){
        pendingSong=null;x.photo=true;x.ok=true;if(x.first===null)x.first=true;save();
        renderStation();
        if(!ok)recMsg("Your song is here for now only. Do not close the page.",true);
        if(!was)celebrate(true);
      });
    };
    return;
  }
  if(isDone(s.id)){
    getSong(function(r){var o=document.getElementById("songOut");if(!o)return;
      o.innerHTML='<div class="fb ok pop" style="font-size:1.1rem">🌟 The star is shining! Great singing!</div>'+
        (r?mediaTag(r)+'<a class="big-btn b-green" style="text-align:center;text-decoration:none" download="Our_Christmas_Song.'+extFor(r.type)+'" href="'+URL.createObjectURL(r.blob)+'">⬇ Save our song</a>':'<p>Your song is saved on another page. You can record it again.</p>');});
  }
}
var gumWait=null,gumId=0;
function startRec(){
  var b0=document.getElementById("recBtn");
  if(b0){b0.disabled=true;b0.textContent="⏳ Opening the microphone ...";}
  recMsg("Tap Allow if the phone asks.");
  var gum,id=++gumId,settled=false;
  try{gum=navigator.mediaDevices.getUserMedia({audio:true});}catch(e){micError(e);return;}
  clearTimeout(gumWait);
  gumWait=setTimeout(function(){if(settled||id!==gumId)return;gumId++;micError({name:"Timeout"});},6000);
  gum.then(function(stream){
    settled=true;clearTimeout(gumWait);
    if(id!==gumId){stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});return;}
    var b1=document.getElementById("recBtn");if(b1)b1.disabled=false;
    var mr;
    try{mr=IS_WEBKIT?new MediaRecorder(stream):new MediaRecorder(stream);}catch(e){stream.getTracks().forEach(function(t){t.stop();});micError(e);return;}
    rec.stream=stream;rec.mr=mr;rec.chunks=[];rec.stopping=false;
    mr.ondataavailable=function(e){if(e.data&&e.data.size)rec.chunks.push(e.data);};
    mr.onstop=function(){finishRec(mr);};
    mr.onerror=function(e){micError(e.error||e);};
    try{mr.start(250);}catch(e){stopTracks();rec.mr=null;micError(e);return;}
    rec.t0=Date.now();
    var b=document.getElementById("recBtn");if(b){b.classList.add("on");b.textContent="⏹ Stop";}
    rec.tick=setInterval(function(){var t=document.getElementById("timer");if(t)t.textContent=fmt((Date.now()-rec.t0)/1000);},250);
    rec.auto=setTimeout(stopRec,120000);
  },function(e){settled=true;clearTimeout(gumWait);if(id!==gumId)return;micError(e);});
}
function stopTracks(){if(rec.stream){rec.stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});rec.stream=null;}}
function stopRec(){
  if(!rec.mr||rec.stopping)return;rec.stopping=true;
  clearInterval(rec.tick);clearTimeout(rec.auto);
  try{rec.mr.stop();}catch(e){finishRec(rec.mr);}
  stopTracks();
}
function finishRec(mr){
  var tries=0;
  (function wait(){
    if(!rec.chunks.length&&tries<10){tries++;setTimeout(wait,20);return;}
    var type=mr.mimeType||(IS_WEBKIT?"audio/mp4":"audio/webm");
    var blob=new Blob(rec.chunks,{type:type});
    rec.mr=null;rec.chunks=[];rec.stopping=false;stopTracks();
    var b=document.getElementById("recBtn");if(b){b.classList.remove("on");b.textContent="🔴 Record again";}
    if(blob.size<256){recMsg("Nothing was recorded. Try again. Sing near the phone.",true);return;}
    pendingSong={blob:blob,type:type,kind:"audio"};
    var s=SING,x=stOf(s.id);showSong(s,x);
  })();
}
function micError(e){
  clearInterval(rec.tick);clearTimeout(rec.auto);rec.mr=null;stopTracks();
  var b=document.getElementById("recBtn");if(b){b.disabled=false;b.classList.remove("on");b.textContent="🔴 Try the microphone again";}
  var v=document.getElementById("vidBtn");if(v){v.className="big-btn b-green pop";v.style.fontSize="";v.textContent="🎥 Film our song";}
  var n=(e&&e.name)||"Error";
  var t;
  if(n==="NotAllowedError"||n==="SecurityError")t=IS_IOS?"The microphone is blocked. Tap aA in the address bar. Tap Website Settings. Set Microphone to Allow.":"The microphone is blocked. Tap the padlock next to the address. Allow the microphone.";
  else if(n==="Timeout")t="The microphone did not open on this page. Tap 🎥 Film our song. It uses the camera.";
  else if(n==="NotFoundError")t="This device has no microphone. Tap 🎥 Film our song.";
  else if(n==="NotReadableError")t="Another app is using the microphone. Close it and try again.";
  else t="Recording did not work ("+n+"). Tap 🎥 Film our song.";
  recMsg(t,true);
}

/* ---------- FINISH ---------- */
function renderFinish(){
  setAddr("finish");
  var d=doneCount(),sc=score(),all=d===N;
  var qs=N-1; var stars=sc>=Math.ceil(qs*0.85)?3:(sc>=Math.ceil(qs*0.6)?2:(sc>=1?1:0));
  var h='<span class="pill">🎄 EAL 2 Christmas Hunt</span>';
  h+='<section class="hero" style="background:linear-gradient(135deg,var(--green),var(--green-d))"><div class="big">'+(all?'🎉':'🧝')+'</div>';
  h+='<h1 class="disp">'+(all?'You found Jingle!':'Nice try, '+esc(S.team)+'!')+'</h1>';
  h+='<p>'+(all?'The tree is full. Merry Christmas, '+esc(S.team)+'!':'You found '+d+' of '+N+' places. You can go back and find more.')+'</p></section>';
  h+='<div class="treebox" style="margin-top:.6rem">'+treeSVG()+'<div class="count disp">'+baubleCount()+' of '+BAUB.length+' baubles</div>'+starLine();
  h+='<div class="stars" aria-label="'+stars+' stars">'+"⭐".repeat(stars)+"☆".repeat(3-stars)+'</div><div>Right first time: '+sc+' of '+qs+'</div></div>';
  h+='<div class="card"><h2 class="disp" style="font-size:1.05rem">Our photos 📸</h2>';
  var g="";ST.forEach(function(s){var p=getPhoto(s.id);if(p)g+='<figure><img src="'+p+'" alt="'+esc(s.title)+'"><figcaption>'+s.em+' '+esc(s.title)+'</figcaption></figure>';});
  h+=g?'<div class="gallery">'+g+'</div>':'<p>No photos yet.</p>';
  h+='<div id="songBox"></div><div class="note">Show this screen to your teacher.</div>';
  h+='<button class="big-btn b-red" id="cardBtn">🎄 Make our Christmas card</button><div id="cardOut"></div></div>';
  M.innerHTML=h;
  BAR.innerHTML='<button class="big-btn b-white" id="backBtn">🎄 Back to the tree</button>';
  document.getElementById("backBtn").onclick=function(){go("map");};
  document.getElementById("cardBtn").onclick=makeCard;
  if(all&&!S.finished){S.finished=true;save();celebrate(true);}
  if(starOn())getSong(function(rec){var b=document.getElementById("songBox");if(!b||!rec)return;
    b.innerHTML='<h2 class="disp" style="font-size:1.05rem;margin-top:.6rem">Our song 🎤</h2>'+mediaTag(rec)+'<a class="big-btn b-green" style="text-align:center;text-decoration:none" download="Our_Christmas_Song.'+extFor(rec.type)+'" href="'+URL.createObjectURL(rec.blob)+'">⬇ Save our song</a>';});
}

function makeCard(){
  var out=document.getElementById("cardOut");
  var pics=ST.map(function(s){return {s:s,p:getPhoto(s.id)};}).filter(function(o){return o.p;});
  var W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;var g=c.getContext("2d");
  g.fillStyle="#0f4d34";g.fillRect(0,0,W,H);
  g.fillStyle="#c8102e";g.fillRect(0,0,W,210);
  g.fillStyle="#f5a20f";g.fillRect(0,210,W,14);
  g.fillStyle="#fff";g.textAlign="center";
  g.font="900 78px 'Arial Black','Segoe UI Black',sans-serif";g.fillText("Merry Christmas!",W/2,110);
  g.font="bold 46px Calibri,Carlito,Arial,sans-serif";g.fillText("from "+S.team,W/2,180);
  for(var i=0;i<40;i++){g.fillStyle="rgba(255,255,255,"+(.15+Math.random()*.4)+")";g.beginPath();g.arc(Math.random()*W,250+Math.random()*(H-330),3+Math.random()*6,0,7);g.fill();}
  var done=function(){
    g.fillStyle="#f5a20f";g.fillRect(0,H-90,W,90);
    g.fillStyle="#111";g.font="bold 40px Calibri,Carlito,Arial,sans-serif";
    g.fillText("🎄 "+doneCount()+" of "+N+" places found  ⭐",W/2,H-32);
    try{
      var url=c.toDataURL("image/jpeg",0.85);
      out.innerHTML='<img class="cardimg pop" src="'+url+'" alt="Our Christmas card"><a class="big-btn b-green" style="text-align:center;text-decoration:none" download="Our_Christmas_Card.jpg" href="'+url+'">⬇ Save the card</a><div class="note">On an iPhone, press and hold the card. Then tap Save.</div>';
    }catch(e){out.innerHTML='<div class="note warn">Sorry, the card did not work.</div>';}
  };
  if(!pics.length){done();return;}
  var cols=pics.length<=4?2:(pics.length<=9?3:4);var rows=Math.ceil(pics.length/cols);
  var gap=18,top=260,areaH=H-top-120,cell=Math.min((W-gap*(cols+1))/cols,(areaH-gap*(rows-1))/rows);
  var startX=(W-(cols*cell+(cols-1)*gap))/2;var left=pics.length;
  pics.forEach(function(o,k){var im=new Image();im.onload=im.onerror=function(){
    var cx=startX+(k%cols)*(cell+gap),cy=top+Math.floor(k/cols)*(cell+gap);
    g.fillStyle="#fff";g.fillRect(cx-6,cy-6,cell+12,cell+12);
    if(im.naturalWidth){var sw=Math.min(im.naturalWidth,im.naturalHeight);
      g.drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sw)/2,sw,sw,cx,cy,cell,cell);}
    if(--left===0)done();
  };im.src=o.p;});
}

/* ---------- confetti ---------- */
var fx=document.getElementById("fx"),fc=fx.getContext("2d"),parts=[],anim=null;
function celebrate(big){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  fx.width=innerWidth;fx.height=innerHeight;
  var cols=["#c8102e","#0f4d34","#f5a20f","#ffffff","#1d5fa8","#7dff6b"];
  for(var i=0;i<(big?220:90);i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.6,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,
    s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,life:120+Math.random()*60});
  if(!anim)anim=requestAnimationFrame(tick);
}
function tick(){
  fc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(function(p){return p.life>0&&p.y<fx.height+40;});
  parts.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.life--;
    fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fc.restore();});
  anim=parts.length?requestAnimationFrame(tick):null;
  if(!anim)fc.clearRect(0,0,fx.width,fx.height);
}

/* ---------- stop double-tap and pinch zoom (iPhone fallback) ---------- */
var lastTouch=0;
document.addEventListener("touchend",function(e){var now=Date.now();
  var t=e.target;var live=t.closest&&t.closest("button,a,input,label");
  if(now-lastTouch<350&&!live){e.preventDefault();}lastTouch=now;},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
document.addEventListener("dblclick",function(e){e.preventDefault();},{passive:false});

/* star: works on every screen */
M.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest("[data-singstar]");if(t){e.preventDefault();go("station",SING.id);}});

/* ---------- go ---------- */
applySize();
go(S.started?"map":"start");
})();
